<div class="card mb-4">
  <div class="card-header">
    <h5>{{ isEditing ? 'Editar Produto' : 'Novo Produto' }}</h5>
  </div>
  <div class="card-body">
    <form (ngSubmit)="onSubmit()">
      <div class="row">
        <div class="col-md-8">
          <label class="form-label">Nome</label>
          <input type="text" class="form-control" [(ngModel)]="product.name" name="name" required>
        </div>

        <div class="col-md-4">
          <label class="form-label">Preço</label>
          <input type="number" class="form-control" [(ngModel)]="product.price" name="price" step="0.01" required>
        </div>
      </div>

      <div class="row mt-3">
        <div class="col-md-6">
          <label class="form-label">Descrição</label>
          <input type="text" class="form-control" [(ngModel)]="product.description" name="description">
        </div>
        <div class="col-md-3">
          <label class="form-label">SKU</label>
          <input type="text" class="form-control" [(ngModel)]="product.sku" name="sku">
        </div>
        <div class="col-md-3">
          <label class="form-label">Imagem</label>
          <input type="file" class="form-control" (change)="onImageChange($event)">
        </div>
      </div>

      <div class="mt-3">
        <button type="submit" class="btn btn-success">
          {{ isEditing ? 'Atualizar' : 'Salvar' }}
        </button>
        <button *ngIf="isEditing" type="button" class="btn btn-secondary ms-2" (click)="onCancel()">
          Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
